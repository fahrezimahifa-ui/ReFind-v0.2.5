<!doctype html>
<html lang="en">
<head>
  <script src="js/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="app-base" content="{{BASE_PATH}}"><title>Explore — ReFind</title><link rel="icon" type="image/svg+xml" href="assets/refind-logo-mark.svg"><link rel="icon" type="image/png" sizes="32x32" href="assets/refind-favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/refind-shortcut-180.png"><link rel="stylesheet" href="vendor/bootstrap.min.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/student.css"></head>
<body data-page="browse" data-requires-auth="true">{{APP_NAVBAR}}
<main class="student-main"><header class="page-heading"><div><span class="eyebrow">CAMPUS LOST &amp; FOUND</span><h1>Find your way back to it.</h1><p>Explore reports around campus. Similarity is a suggestion, not proof of ownership.</p></div><a class="btn btn-primary" href="report.html" data-student-only hidden>Report an item</a></header>
<section class="filter-panel" aria-label="Search and filters"><div class="search-row"><label class="search-field" for="filter-q"><span class="visually-hidden">Search reports</span><input class="form-control" id="filter-q" type="search" maxlength="200" placeholder="Search item, category or location"></label><button class="btn btn-outline" id="filter-toggle" type="button" aria-controls="advanced-filters" aria-expanded="false">Filters</button></div>
<div class="type-tabs" role="group" aria-label="Report type"><button type="button" class="type-tab active" data-filter-type="" aria-pressed="true">All</button><button type="button" class="type-tab" data-filter-type="LOST" aria-pressed="false">Lost</button><button type="button" class="type-tab" data-filter-type="FOUND" aria-pressed="false">Found</button></div>
<div class="advanced-filters" id="advanced-filters" hidden><div class="field"><label for="filter-category">Category</label><select class="form-select" id="filter-category"></select></div><div class="field"><label for="filter-location">Campus area</label><select class="form-select" id="filter-location"></select></div><div class="field"><label for="filter-status">Status</label><select class="form-select" id="filter-status"></select></div><div class="field"><label for="filter-date">Event date</label><input class="form-control" id="filter-date" type="date"></div></div>
<div class="results-line"><span id="result-count" role="status">Loading reports…</span><button class="text-button" id="clear-filters" type="button">Clear filters</button></div></section>
<div class="feedback" id="page-feedback" role="alert" tabindex="-1" hidden></div><button class="btn btn-outline" id="retry-page" type="button" hidden>Retry loading</button><div id="page-loading" class="loading-note" role="status">Loading discovery cards…</div><div id="browse-results" class="discovery-grid"></div><div id="pager" class="pager"></div>
</main><footer class="footer">ReFind 0.2.5 · Discover, verify, return</footer><script src="vendor/jquery.min.js"></script><script src="js/api.js"></script><script src="js/shell.js"></script><script src="js/student-common.js"></script><script src="js/student.js"></script></body></html>

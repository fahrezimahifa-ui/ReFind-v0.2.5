name: Security maintenance
on:
  pull_request:
  push:
    branches: [main, codex/security-dependency-maintenance]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -B tools/test-security-maintenance.py
      - run: python3 -B tools/check-security-maintenance.py --online

name: Release readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/release-readiness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, fileinfo, zip
          coverage: none
          tools: composer:v2
      - run: npm ci --ignore-scripts
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax
        run: find app api tools -name '*.php' -print0 | xargs -0 -n1 php -l && php -l page.php
      - run: npm run check:js
      - run: npm run lint
      - run: composer analyse
      - run: python tools/test-release.py
      - name: Whitespace
        run: git diff-tree --check HEAD^ HEAD
      - name: Redacted history secret scan
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --location "$base/gitleaks_${version}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' "$RUNNER_TEMP/checksums.txt")
          test -n "$expected"
          echo "$expected  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all --no-textconv --no-ext-diff' --config .gitleaks.toml --redact=100 --no-banner .
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REFIND_TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start disposable QA services
        run: docker compose -f compose.qa.yml up --build --detach --wait
      - name: Prepare isolated app and verify fresh setup / recovery
        run: |
          docker compose -f compose.qa.yml exec -T qa python3 tools/prepare-test.py
          docker compose -f compose.qa.yml exec -T qa python3 tools/test-disposable-recovery.py
      - name: Student, BM, security and visual regression suites
        run: docker compose -f compose.qa.yml exec -T qa node tools/run-qa.cjs
      - name: Collect synthetic receipts and captures
        if: always()
        run: |
          mkdir -p output/playwright/release-readiness/results
          docker compose -f compose.qa.yml cp qa:/var/www/html/ReFind_0.2.3/output/playwright/release-readiness/results/. output/playwright/release-readiness/results/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-qa-evidence
          path: output/playwright/release-readiness/results/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable services
        if: always()
        run: docker compose -f compose.qa.yml down --volumes --remove-orphans
